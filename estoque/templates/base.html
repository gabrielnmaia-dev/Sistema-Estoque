<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sistema de Estoque{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        {% comment %}
        <a class="navbar-brand" href="{% url 'home' %}">📦 Estoque</a>
        {%endcomment %}

        <div class="navbar-nav ms-auto">
          {% if user.is_authenticated %}

          <!-- Menu do Gerente -->
          {% if user.groups.all.0.name == 'Gerente' or user.is_staff %}
          <a class="nav-link" href="{% url 'produto-list' %}">Produtos</a>
          <a class="nav-link" href="{% url 'categoria-list' %}">Categorias</a>
          <a class="nav-link" href="{% url 'funcionario-list' %}"
            >Funcionários</a
          >
          {% endif %}

          <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">
              Sair
            </button>
          </form>

          {% else %}
          <a class="nav-link" href="{% url 'login' %}">Fazer Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">{% block content %}{% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
