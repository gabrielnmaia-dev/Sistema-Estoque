<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Sistema de Estoque{% endblock %}</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="idytfiydtc"></nav>

    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">Estoque</a>

        <div>
          <a
            href="{% url 'produto-list' %}"
            class="btn btn-outline-light btn-sm"
            >Produtos</a
          >
          <a
            href="{% url 'categoria-list' %}"
            class="btn btn-outline-light btn-sm"
            >Categorias</a
          >
        </div>
      </div>
    </nav>

    <div class="container">{% block content %} {% endblock %}</div>
  </body>
</html>
